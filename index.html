<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Unique Gestor — gestão clara, inteligente e humana de plantões e escalas." />
    <meta name="theme-color" content="#0a939d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unique Gestor" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Unique Gestor</title>
    <script>
      try {
        const themeColor = localStorage.getItem('plantaoCheck_themeColor')
        if (themeColor) {
          document.documentElement.style.setProperty('--pc-brand', themeColor)
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', themeColor)
        }
      } catch (e) {
        console.error('Erro ao injetar tema do localStorage', e)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
